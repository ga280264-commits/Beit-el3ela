
name: Build Beit el3ela APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html
          if [ -f profile.jpg ]; then
            cp profile.jpg www/profile.jpg
          fi

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install -D @capacitor/cli@7

      - name: Create Android project
        run: |
          npx cap init "Beit el3ela" "com.ga280264.beitel3ela" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: gradle -p android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Beit-el3ela-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
